
[project]
name = "template-version-check"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "LINCC Frameworks", email = "lincc-frameworks-team@lists.lsst.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "GitPython",
    "packaging",
]

[project.urls]
"Source Code" = "https://github.com/lincc-frameworks/template-version-check"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
dev = [
    "black",
    "pytest",
    "pytest-mock", # Used to mock out functions
    "pre-commit", # Used to run checks before finalizing a git commit
    "pylint",
]

[project.scripts]
    check-lincc-frameworks-template-version = "pre_commit_hooks.check_template_version:main"

[build-system]
requires = [
    "setuptools>=62", # Used to build and package the Python project
    "setuptools_scm>=6.2", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/pre_commit_hooks/_version.py"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "src",
    "docs",
]
addopts = "--doctest-modules --doctest-glob=*.rst"

[tool.black]
line-length = 110
target-version = ["py310"]
[tool.isort]
profile = "black"
line_length = 110


[tool.coverage.run]
omit=["src/pre_commit_hooks/_version.py"]
